[pytest]
;注册mark标记
;addopts = --html=report.html --self-contained-html  #配置文件
addopts = --alluredir=temps --clean-alluredir -m web --driver chrome
;这里只会生成数据没有报告

;生成报告
;allure generate -o report  -c temps
;临时数据目录temp，--clean-alluredir 清除原有的目录
;终端直接输pytest，也会直接生成html测试报告
markers =
    api:接口测试
    web:UI测试
    ut:单元测试
    login:登录相关
    pay:支付相关
    ddt:数据驱动测试

log_file = ./logs/pytest.log
log_file_level = info
log_file_format = %(levelname)-8s %(asctime)s [%(name)s:%(lineno)s]  : %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

;记录用例执行结果
result_log_enable = 1
;记录用例分割线
result_log_separator = 1
;分割线等级
result_log_level_separator = warning
;异常信息登等级
result_log_level_verbose = info